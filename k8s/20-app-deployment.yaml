# Two replicas: either pod can run jobs; if one dies, the other resumes its jobs (heartbeat + checkpoint).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: billrun-service
  namespace: telecom-billrun
  labels:
    app: billrun-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: billrun-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: billrun-service
    spec:
      # > spring.lifecycle.timeout-per-shutdown-phase and executor awaitTermination (60s)
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z mysql 3306; do echo waiting for mysql; sleep 3; done"]
      containers:
        - name: app
          image: telecom-billrun-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: billrun-config
            - secretRef:
                name: billrun-secrets
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 5
            failureThreshold: 30
          # Liveness must not depend on jobs: a pod busy with a long bill run is healthy
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: 500m, memory: 512Mi }
            limits: { memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
