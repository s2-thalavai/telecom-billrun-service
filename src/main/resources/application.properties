# =====================================================================
# Telecom bill run service. Profiles: default (H2 + seeded accounts), prod (MySQL + Flyway), test
# =====================================================================
spring.application.name=telecom-billrun-service
server.port=${SERVER_PORT:8080}

# Graceful shutdown: running chunks get time to finish (keep < Kubernetes terminationGracePeriodSeconds).
# Jobs still running at shutdown are resumed from their checkpoint by StaleJobRecovery.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=60s

# ---------- Data ----------
spring.datasource.url=jdbc:h2:mem:billing;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=20
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=false

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# ---------- Jobs (JobProperties) ----------
telecom.jobs.chunk-size=100
telecom.jobs.max-runtime=2h
telecom.jobs.heartbeat-timeout=2m
telecom.jobs.workers=2
telecom.jobs.queue-capacity=20
telecom.jobs.progress-push-interval-ms=1000
telecom.jobs.recovery-interval-ms=60000

# ---------- Billing simulation (BillingProperties) ----------
# rating-latency per account: 5000 accounts x 20ms = ~100s bill run
telecom.billing.rating-latency=20ms
# every Nth account fails rating (0 = none); shows per-item failure handling
telecom.billing.failing-every=250
# demo data (DataSeeder, not in prod)
telecom.billing.seed-accounts=5000

# ---------- Logging: every worker line carries the job id ----------
logging.pattern.level=%5p [job=%X{jobId:-}]
logging.level.com.telecom.billing.service.InvoiceNotificationService=INFO

# ---------- Actuator ----------
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
