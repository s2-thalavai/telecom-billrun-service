# Test profile: 600 accounts x 5ms = a ~3s bill run; 1 worker + queue of 1 to exercise rejection
spring.datasource.url=jdbc:h2:mem:billingtest;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false

telecom.jobs.chunk-size=50
telecom.jobs.workers=1
telecom.jobs.queue-capacity=1
telecom.jobs.heartbeat-timeout=30s
telecom.jobs.progress-push-interval-ms=200
# recovery is triggered explicitly in tests
telecom.jobs.recovery-interval-ms=3600000

telecom.billing.rating-latency=5ms
telecom.billing.failing-every=100
telecom.billing.seed-accounts=600
